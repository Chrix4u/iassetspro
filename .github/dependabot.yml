version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "deps(bun)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "deps(actions)"
