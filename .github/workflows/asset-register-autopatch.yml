name: Asset Register Autopatch

on:
  push:
    branches:
      - fix/assets-register-responsive-condition-20261013

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/assets-register-responsive-condition-20261013
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed surgical patch
        run: python3 scripts/asset-register-condition-autopatch.py

      - name: Validate patch shape
        run: |
          git diff --check
          grep -F 'acquisitionCondition String    @default("new")' prisma/schema.prisma
          grep -F '<SelectItem value="new">New</SelectItem><SelectItem value="used">Used</SelectItem>' src/components/modules/AssetPages.tsx
          grep -F "'acquisitionCondition', 'condition', 'status', 'criticality'" src/app/api/assets/[id]/route.ts

      - name: Commit implementation and retire helper
        run: |
          git config user.name "iAssetsPro CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/asset-register-autopatch.yml scripts/asset-register-condition-autopatch.py
          git add prisma/schema.prisma src/components/modules/AssetPages.tsx src/app/api/assets/route.ts src/app/api/assets/[id]/route.ts
          git commit -m "fix: split asset acquisition condition and harden register layout"
          git push origin HEAD:refs/heads/fix/assets-register-responsive-condition-20261013
