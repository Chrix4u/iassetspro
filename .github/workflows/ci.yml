# =============================================================================
# iAssetsPro EAM — Main CI Pipeline
# =============================================================================
# Triggers on pushes to main/develop, pull requests, and manual dispatch.
# Jobs: lint/typecheck/unit → app build + container build → Repairs UAT + platform E2E
# Full-repository TypeScript debt is reported separately inside the typecheck job.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: TypeScript — Repairs Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Enforce canonical RWOP lifecycle service imports
        run: bunx tsx scripts/check-rwop-legacy-lifecycle-imports.ts

      - name: Run Repairs/RWOP TypeScript hard gate
        run: bunx tsc -p tsconfig.repairs.json --noEmit

      - name: Report full-repository TypeScript debt
        continue-on-error: true
        run: bunx tsc --noEmit

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production application
        env:
          NEXT_PUBLIC_BUILD_VERSION: ${{ github.sha }}
        run: bun run build

      - name: Upload standalone build for CI consumers
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/standalone
          include-hidden-files: true
          retention-days: 7

      - name: Assemble compact production release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-bundle .release-tools
          mkdir -p .release-bundle/prisma .release-bundle/scripts .release-tools

          cp -a .next/standalone/. .release-bundle/
          cp -a prisma/migrations .release-bundle/prisma/
          cp prisma/schema.prisma .release-bundle/prisma/schema.prisma
          cp prisma.config.ts package.json bun.lock .release-bundle/
          cp scripts/seed-transitions.ts .release-bundle/scripts/seed-transitions.ts
          printf '%s\n' "${GITHUB_SHA}" > .release-bundle/RELEASE_SHA

          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          printf '{"private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > .release-tools/package.json
          npm install --prefix .release-tools --omit=dev --no-audit --no-fund
          cp -a .release-tools/node_modules/. .release-bundle/node_modules/

          ARTIFACT="iassetspro-release-${GITHUB_SHA}.tar.gz"
          tar --dereference --hard-dereference -C .release-bundle -czf "$ARTIFACT" .
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          test "$(tar -xOf "$ARTIFACT" ./RELEASE_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          tar -tvzf "$ARTIFACT" | awk '
            substr($1,1,1) == "l" || substr($1,1,1) == "h" {
              print "STOP: release artifact contains link entry: " $0 > "/dev/stderr"
              bad=1
            }
            END { exit bad }
          '

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: |
            iassetspro-release-${{ github.sha }}.tar.gz
            iassetspro-release-${{ github.sha }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0

  # Build the actual production Dockerfile in CI. A successful Next standalone
  # build alone is insufficient evidence that the image deployed to the VPS is
  # buildable or starts from a valid runtime filesystem.
  container-build:
    name: Production Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: iassetspro-eam:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BUILD_VERSION=${{ github.sha }}

  # Repairs/RWOP UAT is a hard release gate. It runs for pull requests, manual
  # verification of an exact branch head, and again on the exact main SHA that
  # may be deployed. It uses real MariaDB + Redis service containers, verifies
  # the deployed schema and BullMQ round-trip, then exercises the exact
  # standalone production artifact with Playwright.
  repairs-uat:
    name: Repairs UAT (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [build, container-build]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: uat_test_root
          MARIADB_DATABASE: repairs_uat
          MARIADB_USER: repairs_uat
          MARIADB_PASSWORD: repairs_uat_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://repairs_uat:repairs_uat_pass@127.0.0.1:3306/repairs_uat
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: repairs-uat-ci-nextauth-secret-not-for-production
      JWT_SECRET: repairs-uat-ci-jwt-secret-not-for-production-32-bytes-minimum
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Create isolated UAT schema
        run: bunx prisma db push

      - name: Seed Repairs UAT data, RBAC, and labor costing
        run: |
          bunx tsx scripts/seed-repairs-uat.ts
          bunx tsx scripts/seed-repairs-uat-rbac.ts
          bunx tsx scripts/seed-repairs-uat-costing.ts

      - name: Run Repairs RC1 MariaDB/Redis/BullMQ preflight
        run: bun run test:repairs-rc1-preflight

      - name: Run Repairs notification BullMQ burst validation
        env:
          REPAIRS_NOTIFICATION_LOAD_JOBS: 100
        run: bun run test:repairs-notification-load

      - name: Download production standalone build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Install Playwright Chromium browser with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Repairs/RWOP Playwright UAT
        run: bun run test:repairs-uat

      - name: Upload Repairs UAT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repairs-uat-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Platform E2E is a second hard gate, separate from Repairs UAT. It gets its
  # own fresh database so the destructive full demo seed is deterministic and
  # cannot interfere with Repairs scenarios. Running it on PRs prevents broken
  # platform-test infrastructure from reaching main and blocking deployments.
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build, container-build]

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: platform_e2e_root
          MARIADB_DATABASE: platform_e2e
          MARIADB_USER: platform_e2e
          MARIADB_PASSWORD: platform_e2e_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://platform_e2e:platform_e2e_pass@127.0.0.1:3306/platform_e2e
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: platform-e2e-ci-nextauth-secret-not-for-production
      JWT_SECRET: platform-e2e-ci-jwt-secret-not-for-production-32-bytes-minimum
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Create isolated platform E2E schema
        run: bunx prisma db push

      - name: Seed full platform demo data
        run: bun run seed

      - name: Download production standalone build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Install Playwright Chromium browser with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run platform Playwright E2E (Chromium only)
        run: bun run test:e2e --project=chromium

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, typecheck, unit-tests, build, container-build, repairs-uat, e2e-tests]

    steps:
      - name: Verify all required jobs succeeded
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          CONTAINER: ${{ needs.container-build.result }}
          REPAIRS_UAT: ${{ needs.repairs-uat.result }}
          E2E: ${{ needs.e2e-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          RESULTS=("$LINT" "$TYPECHECK" "$UNIT" "$BUILD" "$CONTAINER" "$REPAIRS_UAT" "$E2E")
          printf 'lint=%s typecheck=%s unit=%s build=%s container=%s repairs_uat=%s e2e=%s\n' \
            "$LINT" "$TYPECHECK" "$UNIT" "$BUILD" "$CONTAINER" "$REPAIRS_UAT" "$E2E"
          for result in "${RESULTS[@]}"; do
            [[ "$result" == "success" ]]
          done
