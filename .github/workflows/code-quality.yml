# =============================================================================
# iAssetsPro EAM — Scheduled Code Quality Checks
# =============================================================================
# Runs every Monday at 9:00 AM UTC + manual trigger.
# Jobs: dependency audit, outdated check, Prisma schema validation.
# =============================================================================

name: Code Quality

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

concurrency:
  group: code-quality
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Dependency Security Audit
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit || true
        continue-on-error: true

      - name: Run npm audit as fallback (wider vulnerability DB)
        run: |
          echo "Running npm audit for broader vulnerability coverage..."
          npm audit --omit=dev --audit-level=high 2>&1 || true
        continue-on-error: true

      - name: Generate audit summary
        if: always()
        run: |
          echo "## 🔒 Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule**: Every Monday at 09:00 UTC" >> $GITHUB_STEP_SUMMARY
          echo "**Run date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Review any vulnerabilities found above and update dependencies accordingly." >> $GITHUB_STEP_SUMMARY
          echo "> Use \`bun update\` or \`bun add <package>@latest\` to address findings." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 2: Outdated Dependencies Check
  # ---------------------------------------------------------------------------
  outdated-check:
    name: Outdated Dependencies Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for outdated packages
        run: |
          echo "## 📦 Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          OUTDATED_OUTPUT=$(bun outdated 2>&1 || true)

          if echo "$OUTDATED_OUTPUT" | grep -q "No outdated"; then
            echo "✅ **All dependencies are up to date!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "$OUTDATED_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> To update all: \`bun update\`" >> $GITHUB_STEP_SUMMARY
            echo "> To update a specific package: \`bun add <package>@latest\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Prisma Schema Validation
  # ---------------------------------------------------------------------------
  prisma-validate:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # These are the hard correctness gates. Either failure makes the job red.
      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client (verify no generation errors)
        run: bunx prisma generate

      # Formatting is code-quality debt, not schema invalidity. Keep it highly
      # visible as a warning without misreporting a valid schema as broken.
      - name: Check Prisma schema formatting
        id: prisma-format
        continue-on-error: true
        run: |
          if bunx prisma format --check; then
            echo "✅ Prisma schema is properly formatted"
          else
            echo "::warning title=Prisma formatting drift::prisma/schema.prisma is valid but not fully formatted. Run 'bunx prisma format' in a dedicated formatting change."
            exit 1
          fi

      - name: Prisma validation summary
        if: always()
        run: |
          echo "## 🗄️ Prisma Schema Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" != "success" ]; then
            echo "❌ **Schema validation or Prisma client generation failed** — review the hard-gate logs above." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.prisma-format.outcome }}" = "failure" ]; then
            echo "✅ **Schema is valid and Prisma Client generates successfully.**" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Formatting drift detected** — run \`bunx prisma format\` in a dedicated formatting cleanup." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Schema is valid, generates successfully, and is properly formatted.**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Check date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
