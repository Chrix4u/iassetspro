# =============================================================================
# iAssetsPro EAM — Scheduled Code Quality Checks
# =============================================================================
# Runs every Monday at 9:00 AM UTC + manual trigger.
# Jobs: dependency audit, outdated check, Prisma schema validation.
# =============================================================================

name: Code Quality

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

concurrency:
  group: code-quality
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Dependency Security Audit
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit || true
        continue-on-error: true

      - name: Run npm audit as fallback (wider vulnerability DB)
        run: |
          echo "Running npm audit for broader vulnerability coverage..."
          npm audit --omit=dev --audit-level=high 2>&1 || true
        continue-on-error: true

      - name: Generate audit summary
        if: always()
        run: |
          echo "## 🔒 Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule**: Every Monday at 09:00 UTC" >> $GITHUB_STEP_SUMMARY
          echo "**Run date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Review any vulnerabilities found above and update dependencies accordingly." >> $GITHUB_STEP_SUMMARY
          echo "> Use \`bun update\` or \`bun add <package>@latest\` to address findings." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 2: Outdated Dependencies Check
  # ---------------------------------------------------------------------------
  outdated-check:
    name: Outdated Dependencies Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for outdated packages
        run: |
          echo "## 📦 Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run bun outdated and capture output
          OUTDATED_OUTPUT=$(bun outdated 2>&1 || true)

          if echo "$OUTDATED_OUTPUT" | grep -q "No outdated"; then
            echo "✅ **All dependencies are up to date!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "$OUTDATED_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> To update all: \`bun update\`" >> $GITHUB_STEP_SUMMARY
            echo "> To update a specific package: \`bun add <package>@latest\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Prisma Schema Validation
  # ---------------------------------------------------------------------------
  prisma-validate:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client (verify no generation errors)
        run: bunx prisma generate

      - name: Format Prisma schema check
        run: |
          FORMAT_DIFF=$(bunx prisma format --check 2>&1 || true)
          if echo "$FORMAT_DIFF" | grep -qi "formatted"; then
            echo "⚠️  Prisma schema is not properly formatted!"
            echo "Run 'bunx prisma format' to fix formatting."
            echo ""
            echo "$FORMAT_DIFF"
            exit 1
          else
            echo "✅ Prisma schema is properly formatted"
          fi

      - name: Prisma validation summary
        if: always()
        run: |
          echo "## 🗄️ Prisma Schema Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Schema is valid** — no errors found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Schema validation failed** — review logs above" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Check date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
