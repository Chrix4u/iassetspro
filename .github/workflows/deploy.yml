name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI workflow run ID containing production-release
        required: true
        type: string
      release_sha:
        description: Exact main commit SHA produced by that CI run
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
  CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://iassetspro.lightworldtech.com' }}

jobs:
  deploy-production:
    name: Deploy tested artifact to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: >-
      ${{
        vars.ENABLE_PRODUCTION_DEPLOY == 'true' &&
        (
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}

    steps:
      - name: Validate exact successful CI run provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid CI run ID" >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA" >&2; exit 1; }

          RUN_URL="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          RUN="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RUN_URL")"

          test "$(jq -r '.id | tostring' <<<"$RUN")" = "$CI_RUN_ID"
          test "$(jq -r '.name' <<<"$RUN")" = "CI"
          test "$(jq -r '.path' <<<"$RUN")" = ".github/workflows/ci.yml"
          test "$(jq -r '.head_branch' <<<"$RUN")" = "main"
          test "$(jq -r '.head_sha' <<<"$RUN")" = "$RELEASE_SHA"
          test "$(jq -r '.status' <<<"$RUN")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN")" = "success"
          [[ "$(jq -r '.event' <<<"$RUN")" =~ ^(push|workflow_dispatch)$ ]]

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            test "$CI_RUN_ID" = "${{ github.event.workflow_run.id }}"
            test "$RELEASE_SHA" = "${{ github.event.workflow_run.head_sha }}"
          fi

          PRS_URL="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls"
          PRS="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$PRS_URL")"
          MERGED_PR_COUNT="$(jq --arg sha "$RELEASE_SHA" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length' \
            <<<"$PRS")"
          if (( MERGED_PR_COUNT < 1 )); then
            echo "Refusing deployment: release SHA is not the merge result of a merged PR targeting main." >&2
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download tested production artifact from CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify release artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="release-artifact/iassetspro-release-${RELEASE_SHA}.tar.gz"
          CHECKSUM="${ARTIFACT}.sha256"
          test -s "$ARTIFACT"
          test -s "$CHECKSUM"
          (cd release-artifact && sha256sum -c "$(basename "$CHECKSUM")")
          EMBEDDED_SHA="$(tar -xOf "$ARTIFACT" ./RELEASE_SHA | tr -d '\r\n')"
          test "$EMBEDDED_SHA" = "$RELEASE_SHA"

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo "DEPLOY_PORT out of range" >&2; exit 1; }

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/iassetspro_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/iassetspro_deploy ~/.ssh/known_hosts

          KNOWN_HOST_QUERY="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then
            KNOWN_HOST_QUERY="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$KNOWN_HOST_QUERY" -f ~/.ssh/known_hosts >/dev/null

      - name: Attest installed privileged deployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_SOURCE="scripts/deploy-production-artifact.sh"
          CORE_SOURCE="scripts/deploy-production-artifact-core.sh"
          WRAPPER_REMOTE_PATH="/usr/local/sbin/iassetspro-deploy-artifact"
          CORE_REMOTE_PATH="/usr/local/sbin/deploy-production-artifact-core.sh"

          test -s "$WRAPPER_SOURCE"
          test -s "$CORE_SOURCE"
          EXPECTED_WRAPPER="$(sha256sum "$WRAPPER_SOURCE" | awk '{print $1}')"
          EXPECTED_CORE="$(sha256sum "$CORE_SOURCE" | awk '{print $1}')"

          SSH=(ssh -4 -i ~/.ssh/iassetspro_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          REMOTE_HASHES="$("${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo sha256sum '$WRAPPER_REMOTE_PATH' '$CORE_REMOTE_PATH'")"

          ACTUAL_WRAPPER="$(awk -v path="$WRAPPER_REMOTE_PATH" '$2 == path {print $1}' <<<"$REMOTE_HASHES")"
          ACTUAL_CORE="$(awk -v path="$CORE_REMOTE_PATH" '$2 == path {print $1}' <<<"$REMOTE_HASHES")"

          test -n "$ACTUAL_WRAPPER"
          test -n "$ACTUAL_CORE"
          if [[ "$ACTUAL_WRAPPER" != "$EXPECTED_WRAPPER" ]]; then
            echo "Refusing deployment: installed wrapper does not match reviewed release source." >&2
            exit 1
          fi
          if [[ "$ACTUAL_CORE" != "$EXPECTED_CORE" ]]; then
            echo "Refusing deployment: installed core deployer does not match reviewed release source." >&2
            exit 1
          fi
          echo "Privileged deployer attestation passed."

      - name: Upload artifact to production inbox
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_INBOX: ${{ secrets.DEPLOY_INBOX || '/home/iassetsdeploy/incoming' }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="iassetspro-release-${RELEASE_SHA}.tar.gz"
          CHECKSUM="${ARTIFACT}.sha256"
          REMOTE_DIR="${DEPLOY_INBOX}/${RELEASE_SHA}"
          SSH=(ssh -4 -i ~/.ssh/iassetspro_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SCP=(scp -4 -i ~/.ssh/iassetspro_deploy -P "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REMOTE_DIR'"
          "${SCP[@]}" "release-artifact/$ARTIFACT" "release-artifact/$CHECKSUM" \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/"

      - name: Activate immutable release on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_INBOX: ${{ secrets.DEPLOY_INBOX || '/home/iassetsdeploy/incoming' }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="iassetspro-release-${RELEASE_SHA}.tar.gz"
          CHECKSUM="${ARTIFACT}.sha256"
          REMOTE_DIR="${DEPLOY_INBOX}/${RELEASE_SHA}"
          ssh -4 -i ~/.ssh/iassetspro_deploy -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/iassetspro-deploy-artifact '$RELEASE_SHA' '$REMOTE_DIR/$ARTIFACT' '$REMOTE_DIR/$CHECKSUM'"

      - name: Deployment summary
        if: always()
        run: |
          echo "## iAssetsPro production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI run: \`${CI_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- VPS build/install: **none**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source provenance: **merged PR to main required**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Privileged deployer: **SHA-256 attested to reviewed release source**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment model: GitHub-built immutable artifact + canary + PM2 cutover" >> "$GITHUB_STEP_SUMMARY"
