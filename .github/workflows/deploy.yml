# =============================================================================
# iAssetsPro EAM — Production Deployment Pipeline
# =============================================================================
# Production topology:
#   Nginx -> 127.0.0.1:3001 -> PM2 process "iassetspro" -> Next.js standalone
#
# The Webuzo VPS does not use Docker for iAssetsPro. The exact CI-validated
# commit is built on the server, verified on a temporary canary port, and then
# promoted by replacing only the named PM2 production process.
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  PRODUCTION_PORT: 3001
  DEFAULT_DEPLOY_PATH: /home/lightworld/webapps/iassetspro

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}

    steps:
      - name: Verify successful E2E check for manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # E2E depends on Build + Production Container Build; Build in turn
          # depends on lint, the Repairs TypeScript release gate and unit tests.
          # Therefore a successful E2E check on this exact main SHA proves the
          # entire main-branch CI dependency chain completed successfully.
          CHECK_NAME='E2E Tests (Playwright)'
          DEADLINE=$((SECONDS + 2400))
          API_URL="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100&filter=latest"

          while (( SECONDS < DEADLINE )); do
            PAYLOAD="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL")"
            CHECK="$(jq -c \
              '[.check_runs[] | select(.name == "E2E Tests (Playwright)")] | sort_by(.started_at // .created_at // "") | last // {}' \
              <<< "$PAYLOAD")"
            STATUS="$(jq -r '.status // ""' <<< "$CHECK")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<< "$CHECK")"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "E2E verification failed closed: ${CONCLUSION:-unknown}" >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for E2E verification." >&2
          exit 1

      - name: Validate VPS deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST || secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || { echo "Missing deploy host"; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "Missing deploy user"; exit 1; }
          [[ -n "$DEPLOY_KEY" || -n "$DEPLOY_PASSWORD" ]] || { echo "Missing SSH key or password"; exit 1; }

      - name: Deploy exact validated commit with PM2 canary
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.VPS_APP_PATH || env.DEFAULT_DEPLOY_PATH }}
          PRODUCTION_PORT: ${{ env.PRODUCTION_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD || secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          command_timeout: 50m
          envs: RELEASE_SHA,DEPLOY_PATH,PRODUCTION_PORT
          script: |
            set -euo pipefail
            APP="$DEPLOY_PATH"
            PROD_PORT="$PRODUCTION_PORT"
            PM2_NAME="iassetspro"
            CANARY_NAME="iassetspro-canary"
            ROLLBACK_DIR="$APP/.deploy-rollback"

            cd "$APP"
            test -f .env
            test -d .git
            command -v git >/dev/null
            command -v node >/dev/null
            command -v bun >/dev/null
            command -v pm2 >/dev/null
            command -v curl >/dev/null
            command -v ss >/dev/null

            OLD_SHA="$(git rev-parse HEAD)"

            rollback_runtime() {
              echo "ROLLBACK: restoring previous standalone runtime ${OLD_SHA}"
              pm2 delete "$PM2_NAME" >/dev/null 2>&1 || true
              pm2 delete "$CANARY_NAME" >/dev/null 2>&1 || true

              if [[ ! -f "$ROLLBACK_DIR/standalone/server.js" ]]; then
                echo "ROLLBACK FAILED: previous standalone artifact is unavailable" >&2
                return 1
              fi

              git reset --hard "$OLD_SHA"
              rm -rf "$APP/.next/standalone"
              mkdir -p "$APP/.next"
              cp -a "$ROLLBACK_DIR/standalone" "$APP/.next/standalone"

              PORT="$PROD_PORT" HOSTNAME=127.0.0.1 NODE_ENV=production \
                pm2 start "$APP/.next/standalone/server.js" \
                  --name "$PM2_NAME" --cwd "$APP" \
                  --node-args="--env-file=$APP/.env" --time

              ROLLBACK_OK=0
              for i in $(seq 1 18); do
                CODE=$(curl -s -o /tmp/iassetspro-rollback-health.json -w "%{http_code}" \
                  --max-time 10 "http://127.0.0.1:${PROD_PORT}/api/health" || true)
                echo "Rollback attempt $i/18 -> HTTP $CODE"
                if [[ "$CODE" == "200" ]]; then ROLLBACK_OK=1; break; fi
                sleep 5
              done

              [[ "$ROLLBACK_OK" == "1" ]] || {
                pm2 logs "$PM2_NAME" --lines 100 --nostream || true
                return 1
              }
              pm2 save
              echo "ROLLBACK COMPLETE"
            }

            echo "[1/10] Backing up environment and current production artifact"
            cp -a .env ".env.backup.$(date +%Y%m%d-%H%M%S)"
            test -f .next/standalone/server.js
            rm -rf "$ROLLBACK_DIR"
            mkdir -p "$ROLLBACK_DIR"
            cp -a .next/standalone "$ROLLBACK_DIR/standalone"
            printf '%s\n' "$OLD_SHA" > "$ROLLBACK_DIR/release-sha"

            echo "[2/10] Checking out validated release"
            git fetch origin main
            git cat-file -e "${RELEASE_SHA}^{commit}"
            git checkout -B main origin/main
            git reset --hard "$RELEASE_SHA"
            git restore playwright-report/index.html 2>/dev/null || true

            echo "[3/10] Building production application"
            bun install --frozen-lockfile
            rm -rf .next
            bun run build
            test -f .next/standalone/server.js
            test -f scripts/seed-transitions.ts

            echo "[4/10] Selecting canary port"
            CANARY_PORT=""
            for p in $(seq 3100 3199); do
              if ! ss -ltn | grep -q ":${p} "; then
                CANARY_PORT="$p"
                break
              fi
            done
            test -n "$CANARY_PORT"

            echo "[5/10] Starting and validating canary on $CANARY_PORT"
            pm2 delete "$CANARY_NAME" >/dev/null 2>&1 || true
            PORT="$CANARY_PORT" HOSTNAME=127.0.0.1 NODE_ENV=production \
              pm2 start "$APP/.next/standalone/server.js" \
                --name "$CANARY_NAME" --cwd "$APP" \
                --node-args="--env-file=$APP/.env" --time

            CANARY_OK=0
            for i in $(seq 1 18); do
              CODE=$(curl -s -o /tmp/iassetspro-canary-health.json -w "%{http_code}" \
                --max-time 10 "http://127.0.0.1:${CANARY_PORT}/api/health" || true)
              echo "Canary attempt $i/18 -> HTTP $CODE"
              if [[ "$CODE" == "200" ]]; then CANARY_OK=1; break; fi
              sleep 5
            done
            [[ "$CANARY_OK" == "1" ]] || {
              pm2 logs "$CANARY_NAME" --lines 100 --nostream || true
              pm2 delete "$CANARY_NAME" >/dev/null 2>&1 || true
              exit 1
            }

            echo "[6/10] Promoting canary build to production"
            pm2 delete "$PM2_NAME" >/dev/null 2>&1 || true
            sleep 2
            if ss -ltn | grep -q ":${PROD_PORT} "; then
              echo "Production port ${PROD_PORT} is occupied by a non-PM2-managed process; refusing unsafe cutover."
              ss -ltnp | grep ":${PROD_PORT}" || true
              rollback_runtime || true
              exit 1
            fi

            PORT="$PROD_PORT" HOSTNAME=127.0.0.1 NODE_ENV=production \
              pm2 start "$APP/.next/standalone/server.js" \
                --name "$PM2_NAME" --cwd "$APP" \
                --node-args="--env-file=$APP/.env" --time

            PROD_OK=0
            for i in $(seq 1 18); do
              CODE=$(curl -s -o /tmp/iassetspro-production-health.json -w "%{http_code}" \
                --max-time 10 "http://127.0.0.1:${PROD_PORT}/api/health" || true)
              echo "Production attempt $i/18 -> HTTP $CODE"
              if [[ "$CODE" == "200" ]]; then PROD_OK=1; break; fi
              sleep 5
            done
            if [[ "$PROD_OK" != "1" ]]; then
              pm2 logs "$PM2_NAME" --lines 100 --nostream || true
              rollback_runtime
              exit 1
            fi

            echo "[7/10] Reconciling canonical RWOP lifecycle transitions"
            # This script is transactional and idempotent. If it fails, its DB
            # transaction is rolled back, so restoring the previous runtime is
            # safe and leaves production on the pre-release lifecycle data.
            if ! NODE_ENV=production bun run scripts/seed-transitions.ts; then
              echo "Transition reconciliation failed; restoring previous runtime." >&2
              rollback_runtime
              exit 1
            fi

            echo "[8/10] Revalidating production after transition reconciliation"
            POST_RECONCILE_OK=0
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /tmp/iassetspro-post-reconcile-health.json -w "%{http_code}" \
                --max-time 10 "http://127.0.0.1:${PROD_PORT}/api/health" || true)
              echo "Post-reconcile attempt $i/12 -> HTTP $CODE"
              if [[ "$CODE" == "200" ]]; then POST_RECONCILE_OK=1; break; fi
              sleep 5
            done
            [[ "$POST_RECONCILE_OK" == "1" ]] || {
              # Lifecycle data has already committed successfully at this point;
              # do not automatically run an older binary against the new
              # canonical transition contract. Fail for operator investigation.
              pm2 logs "$PM2_NAME" --lines 100 --nostream || true
              exit 1
            }

            echo "[9/10] Removing canary, rollback artifact and persisting PM2 state"
            pm2 delete "$CANARY_NAME" >/dev/null 2>&1 || true
            rm -rf "$ROLLBACK_DIR"
            pm2 save

            echo "[10/10] Final production status"
            pm2 status "$PM2_NAME"
            ss -ltnp | grep ":${PROD_PORT}" || true
            git log -1 --oneline

      - name: Run public production smoke test
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://iassetspro.lightworldtech.com' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              "${PRODUCTION_URL}/api/health" --max-time 10 2>/dev/null || echo "000")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Production smoke test passed."
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i/12 returned HTTP $HTTP_CODE"
            sleep 10
          done
          exit 1

      - name: Deployment summary — Success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${RELEASE_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: PM2 + Next.js standalone" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production port: \`${PRODUCTION_PORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- RWOP transition reconciliation: completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary — Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step logs before retrying." >> "$GITHUB_STEP_SUMMARY"
