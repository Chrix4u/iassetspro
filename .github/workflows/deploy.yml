# =============================================================================
# iAssetsPro EAM — Production Deployment Pipeline
# =============================================================================
# Production topology:
#   Nginx -> /home/lightworld/webapps/iassetspro (symlink)
#         -> /home/lightworld/releases/iassetspro-<sha>-<timestamp>
#         -> PM2 "iassetspro" -> Next.js standalone
#
# Releases are immutable. After a successful deployment we retain exactly:
#   1) the active release
#   2) the immediately previous release as rollback
# Temporary/canary/build artifacts are cleaned only after local + public smoke.
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  PRODUCTION_PORT: 3001
  DEFAULT_DEPLOY_PATH: /home/lightworld/webapps/iassetspro
  DEFAULT_PRODUCTION_URL: https://iassetspro.lightworldtech.com

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}

    steps:
      - name: Verify successful release checks for manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100&filter=latest"

          for CHECK_NAME in 'Repairs UAT (Playwright)' 'E2E Tests (Playwright)'; do
            DEADLINE=$((SECONDS + 2400))
            echo "Verifying ${CHECK_NAME} on ${RELEASE_SHA}"

            while (( SECONDS < DEADLINE )); do
              PAYLOAD="$(curl --fail-with-body --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API_URL")"
              CHECK="$(jq -c \
                --arg name "$CHECK_NAME" \
                '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at // "") | last // {}' \
                <<< "$PAYLOAD")"
              STATUS="$(jq -r '.status // ""' <<< "$CHECK")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<< "$CHECK")"

              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || {
                  echo "${CHECK_NAME} verification failed closed: ${CONCLUSION:-unknown}" >&2
                  exit 1
                }
                echo "${CHECK_NAME}: success"
                break
              fi
              sleep 15
            done

            (( SECONDS < DEADLINE )) || {
              echo "Timed out waiting for ${CHECK_NAME}." >&2
              exit 1
            }
          done

      - name: Validate VPS deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST || secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || { echo "Missing deploy host"; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "Missing deploy user"; exit 1; }
          [[ -n "$DEPLOY_KEY" || -n "$DEPLOY_PASSWORD" ]] || { echo "Missing SSH key or password"; exit 1; }

      - name: Deploy exact validated commit with immutable release/canary
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.VPS_APP_PATH || env.DEFAULT_DEPLOY_PATH }}
          PRODUCTION_PORT: ${{ env.PRODUCTION_PORT }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || env.DEFAULT_PRODUCTION_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD || secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          command_timeout: 50m
          envs: RELEASE_SHA,DEPLOY_PATH,PRODUCTION_PORT,PRODUCTION_URL
          script: |
            set -euo pipefail

            APP="$DEPLOY_PATH"
            cd "$APP"
            test -d .git

            git fetch origin main
            git cat-file -e "${RELEASE_SHA}^{commit}"
            [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || {
              echo "Release SHA is not current origin/main." >&2
              exit 1
            }

            DEPLOY_SCRIPT="/tmp/iassetspro-deploy-${RELEASE_SHA:0:12}.sh"
            git show "${RELEASE_SHA}:scripts/deploy-production-release.sh" > "$DEPLOY_SCRIPT"
            chmod +x "$DEPLOY_SCRIPT"

            RELEASE_SHA="$RELEASE_SHA" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            PRODUCTION_PORT="$PRODUCTION_PORT" \
            PRODUCTION_URL="$PRODUCTION_URL" \
              "$DEPLOY_SCRIPT"

      - name: Run independent public production smoke test
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || env.DEFAULT_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            HTTP_CODE="$(curl -s -o /tmp/health.json -w "%{http_code}" \
              "${PRODUCTION_URL}/api/health" --max-time 10 2>/dev/null || echo "000")"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Production smoke test passed."
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i/12 returned HTTP $HTTP_CODE"
            sleep 10
          done
          exit 1

      - name: Deployment summary — Success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${RELEASE_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: PM2 + immutable Next.js standalone release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production port: \`${PRODUCTION_PORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- RWOP preflight: driver + schema checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- RWOP transition reconciliation: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: active release + one rollback; obsolete/temp releases cleaned" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary — Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step logs before retrying." >> "$GITHUB_STEP_SUMMARY"
