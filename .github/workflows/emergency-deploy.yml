name: Emergency Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-deploy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/iassetspro-eam
  RELEASE_SHA: ${{ github.sha }}
  RESOLVED_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST || secrets.VPS_IP || secrets.SSH_HOST || secrets.SERVER_HOST || secrets.SERVER_IP }}
  RESOLVED_DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || secrets.VPS_USERNAME || secrets.SSH_USER || secrets.SERVER_USER || secrets.SERVER_USERNAME }}
  RESOLVED_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY || secrets.VPS_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.SERVER_SSH_KEY || secrets.SERVER_PRIVATE_KEY }}
  RESOLVED_DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || secrets.VPS_PASSWORD || secrets.SSH_PASSWORD || secrets.SERVER_PASSWORD }}
  RESOLVED_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.VPS_PORT || secrets.SSH_PORT || secrets.SERVER_PORT || 22 }}
  RESOLVED_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.VPS_APP_PATH || secrets.APP_PATH || secrets.SERVER_APP_PATH || '/opt/iassetspro' }}

jobs:
  deploy-production:
    name: Emergency Deploy to Production
    if: ${{ github.actor == github.repository_owner && contains(github.event.head_commit.message, '[deploy-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate VPS deployment configuration
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$RESOLVED_DEPLOY_HOST" ]] || missing+=("host")
          [[ -n "$RESOLVED_DEPLOY_USER" ]] || missing+=("user")
          if [[ -z "$RESOLVED_DEPLOY_SSH_KEY" && -z "$RESOLVED_DEPLOY_PASSWORD" ]]; then
            missing+=("SSH key or password")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing deployment credential class: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "VPS connection material resolved from existing GitHub Actions secrets."

      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate immutable version tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.RELEASE_SHA }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BUILD_VERSION=${{ env.RELEASE_SHA }}

      - name: Prepare VPS deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.RESOLVED_DEPLOY_HOST }}
          username: ${{ env.RESOLVED_DEPLOY_USER }}
          key: ${{ env.RESOLVED_DEPLOY_SSH_KEY }}
          password: ${{ env.RESOLVED_DEPLOY_PASSWORD }}
          port: ${{ env.RESOLVED_DEPLOY_PORT }}
          script: mkdir -p "${{ env.RESOLVED_DEPLOY_PATH }}"

      - name: Upload production Compose manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.RESOLVED_DEPLOY_HOST }}
          username: ${{ env.RESOLVED_DEPLOY_USER }}
          key: ${{ env.RESOLVED_DEPLOY_SSH_KEY }}
          password: ${{ env.RESOLVED_DEPLOY_PASSWORD }}
          port: ${{ env.RESOLVED_DEPLOY_PORT }}
          source: docker-compose.yml
          target: ${{ env.RESOLVED_DEPLOY_PATH }}
          overwrite: true

      - name: Deploy immutable image to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.RESOLVED_DEPLOY_HOST }}
          username: ${{ env.RESOLVED_DEPLOY_USER }}
          key: ${{ env.RESOLVED_DEPLOY_SSH_KEY }}
          password: ${{ env.RESOLVED_DEPLOY_PASSWORD }}
          port: ${{ env.RESOLVED_DEPLOY_PORT }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ env.RESOLVED_DEPLOY_PATH }}"
            IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.RELEASE_SHA }}"
            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            test -f .env
            echo "${{ github.token }}" | docker login ${{ env.DOCKER_REGISTRY }} -u "${{ github.actor }}" --password-stdin
            APP_IMAGE="$IMAGE_TAG" docker compose pull app
            docker logout ${{ env.DOCKER_REGISTRY }} >/dev/null 2>&1 || true
            APP_IMAGE="$IMAGE_TAG" docker compose up -d --no-build --force-recreate app
            docker image prune -f

      - name: Run production smoke test
        run: |
          set -euo pipefail
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL not configured; deployment completed without external smoke test."
            exit 0
          fi
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_URL}/api/health" --max-time 10 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Production health check passed."
              exit 0
            fi
            echo "Attempt $i/12 returned HTTP $HTTP_CODE"
            sleep 10
          done
          echo "Production health check failed."
          exit 1
