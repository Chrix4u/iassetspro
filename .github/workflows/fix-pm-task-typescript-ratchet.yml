name: PM Task TypeScript Ratchet Repair

on:
  push:
    branches:
      - feature/pm-task-library-foundation-20261022

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pm-task-library-foundation-20261022
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply debt-ratchet repair
        run: python3 scripts/fix_pm_task_typescript_ratchet.py
      - name: Remove temporary repair scaffolding and create local verification commit
        run: |
          rm -f scripts/fix_pm_task_typescript_ratchet.py .github/workflows/fix-pm-task-typescript-ratchet.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pm): clear task library TypeScript ratchet'
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Run focused PM Task contracts
        run: bunx vitest run src/__tests__/pm/pm-task-library-schema-contract.test.ts src/__tests__/pm/pm-task-library-ui-contract.test.ts src/services/pm/__tests__/pmTask.service.test.ts src/services/pm/__tests__/pmTaskImport.service.test.ts
      - name: Lint changed TypeScript sources
        run: bunx eslint prisma/seed-missing.ts src/__tests__/pm/pm-task-library-ui-contract.test.ts
      - name: Run exact TypeScript debt ratchet
        env:
          TYPECHECK_BASE_SHA: 8aad2a196408b86efc29d79a5b19fa26b8c1700b
          TYPECHECK_HEAD_SHA: ${{ github.sha }}
        run: |
          export TYPECHECK_HEAD_SHA=$(git rev-parse HEAD)
          bunx tsx scripts/check-typescript-debt-ratchet.ts
      - name: Run Repairs TypeScript release gate
        run: bunx tsc -p tsconfig.repairs.json --noEmit
      - name: Run full unit suite
        run: bunx vitest run
      - name: Run production build
        run: bun run build
      - name: Verify clean product diff
        run: git diff --check && test -z "$(git status --short)"
      - name: Push verified repair
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/pm-task-library-foundation-20261022
