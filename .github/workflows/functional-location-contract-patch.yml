name: Functional Location Contract Patch

on:
  push:
    branches:
      - feat/functional-location-ui-20261014

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/functional-location-ui-20261014
          fetch-depth: 0

      - name: Align UI with functional-location API contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/components/modules/FunctionalLocationHierarchyPage.tsx')
          source = page.read_text()

          replacements = [
              ('  levelOrder: number\n', '  order: number\n'),
              ('  separator: string\n', '  codeSeparator: string\n'),
              ('  isActive?: boolean\n  allowAssetAssignment?: boolean\n', '  status?: string\n'),
              ('node.allowAssetAssignment', 'node.hierarchyLevel?.allowAssetAssignment'),
              ('selectedLocation.allowAssetAssignment', 'selectedLocation.hierarchyLevel?.allowAssetAssignment'),
              ('selectedLocation.isActive === false', "selectedLocation.status !== 'active'"),
              ('a.levelOrder - b.levelOrder', 'a.order - b.order'),
              ('item.levelOrder > (parentLevel?.levelOrder ?? -1)', 'item.order > (parentLevel?.order ?? -1)'),
              ('`/api/functional-locations?systemId=${encodeURIComponent(systemId)}&active=true`', '`/api/functional-locations?hierarchySystemId=${encodeURIComponent(systemId)}&status=active`'),
              ('        separator: systemForm.separator,\n', '        codeSeparator: systemForm.separator,\n'),
              ('        code: locationForm.code.trim() || undefined,\n', '        locationCode: locationForm.code.trim() || undefined,\n'),
              ('        allowAssetAssignment: locationForm.allowAssetAssignment,\n', ''),
              ('Separator: {selectedSystem.separator}', 'Separator: {selectedSystem.codeSeparator}'),
              ('<Switch checked={locationForm.allowAssetAssignment} onCheckedChange={checked => setLocationForm(current => ({ ...current, allowAssetAssignment: checked }))} />', '<Switch checked={locationForm.allowAssetAssignment} disabled />'),
              ('<div className="text-xs text-muted-foreground">Assets may use this node as their Installed At location.</div>', '<div className="text-xs text-muted-foreground">Inherited from the selected hierarchy level. Change the level definition when creating a hierarchy system.</div>'),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing expected page fragment: {old!r}')
              source = source.replace(old, new)

          page.write_text(source)

          picker = Path('src/components/assets/FunctionalLocationPicker.tsx')
          source = picker.read_text()
          replacements = [
              ('  isActive?: boolean\n  allowAssetAssignment?: boolean\n  hierarchyLevel?: { label?: string } | null\n', '  status?: string\n  hierarchyLevel?: { label?: string; allowAssetAssignment?: boolean } | null\n'),
              ("const params = new URLSearchParams({ systemId: resolvedSystemId, active: 'true' })", "const params = new URLSearchParams({ hierarchySystemId: resolvedSystemId, status: 'active' })"),
              ('.filter(location => !allowAssetAssignmentOnly || location.allowAssetAssignment)', '.filter(location => !allowAssetAssignmentOnly || location.hierarchyLevel?.allowAssetAssignment)'),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing expected picker fragment: {old!r}')
              source = source.replace(old, new)
          picker.write_text(source)
          PY

      - name: Remove one-shot helper and commit
        run: |
          rm .github/workflows/functional-location-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modules/FunctionalLocationHierarchyPage.tsx src/components/assets/FunctionalLocationPicker.tsx .github/workflows/functional-location-contract-patch.yml
          git commit -m "fix: align functional-location UI with API contract"
          git push origin HEAD:feat/functional-location-ui-20261014
