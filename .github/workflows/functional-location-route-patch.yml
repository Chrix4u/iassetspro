name: Functional Location Route Patch

on:
  push:
    branches:
      - feat/functional-location-ui-20261014

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/functional-location-ui-20261014
          fetch-depth: 0

      - name: Apply surgical app-shell route and debt cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/EAMApp.tsx')
          source = path.read_text()

          replacements = {
              "'assets-hierarchy': 'Asset Hierarchy',": "'assets-hierarchy': 'Asset & Location Hierarchy',",
              "'assets-hierarchy': () => import('./modules/AssetPages').then(m => m.AssetsHierarchyPage),": "'assets-hierarchy': () => import('./modules/FunctionalLocationHierarchyPage').then(m => m.default),",
              "this.state = { hasError: false, error: null, componentStack: null, isChunkError: false };": "this.state = { hasError: false, error: null, componentStack: null, isChunkError: false, retryTimer: null, retryCount: 0 };",
              "this.setState({ componentStack: info.componentStack });": "this.setState({ componentStack: info.componentStack ?? null });",
              "return { hasError: false, error: null, componentStack: null, isChunkError: false };\n          }\n          return prev;": "return { ...prev, hasError: false, error: null, componentStack: null, isChunkError: false };\n          }\n          return null;",
          }

          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Remove one-shot helper and commit
        run: |
          rm .github/workflows/functional-location-route-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EAMApp.tsx .github/workflows/functional-location-route-patch.yml
          git commit -m "feat: route asset hierarchy to functional location workspace"
          git push origin HEAD:feat/functional-location-ui-20261014
