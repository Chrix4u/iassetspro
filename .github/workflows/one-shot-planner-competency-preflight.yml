name: One-shot planner competency preflight

on:
  push:
    branches:
      - feat/planner-technician-competency-evidence
    paths:
      - .github/workflows/one-shot-planner-competency-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-technician-competency-evidence
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint changed product files
        run: bunx eslint src/app/api/workers/route.ts src/components/shared/WorkerAssignmentSelector.tsx src/components/modules/MaintenancePages.tsx src/__tests__/work-orders/planner-technician-competency-contract.test.ts

      - name: Repairs TypeScript gate
        run: bunx tsc -p tsconfig.repairs.json --noEmit

      - name: Targeted contract test
        run: bun run test -- src/__tests__/work-orders/planner-technician-competency-contract.test.ts

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-planner-competency-preflight.yml
          git commit -m "chore: remove planner competency preflight workflow"
          git push origin HEAD:feat/planner-technician-competency-evidence
