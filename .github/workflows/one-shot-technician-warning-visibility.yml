name: One-shot technician readiness warning visibility

on:
  push:
    branches:
      - fix/technician-readiness-warning-visibility
    paths:
      - .github/workflows/one-shot-technician-warning-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technician-readiness-warning-visibility
          fetch-depth: 0

      - name: Patch technician readiness presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('src/components/modules/TechnicianWorkOrderPage.tsx')
          page = page_path.read_text()

          waiting_anchor = "const WAITING_STATUSES = ['waiting_parts', 'waiting_tools', 'waiting_shutdown', 'waiting_permit'];\n"
          warning_codes = """const WAITING_STATUSES = ['waiting_parts', 'waiting_tools', 'waiting_shutdown', 'waiting_permit'];
          const TECHNICIAN_HIDDEN_PROFILE_WARNING_CODES = new Set([
            'TECH_ELIG_TRADE_MISMATCH',
            'TECH_ELIG_NO_SKILL_RECORD',
            'TECH_ELIG_NO_CERTIFICATION',
          ]);
          """
          if waiting_anchor not in page:
              raise SystemExit('WAITING_STATUSES anchor not found')
          page = page.replace(waiting_anchor, warning_codes, 1)

          old_warnings = "  const startWarnings = startReadiness?.warnings || [];"
          new_warnings = """  const startWarnings = (startReadiness?.warnings || []).filter(
            (item) => !TECHNICIAN_HIDDEN_PROFILE_WARNING_CODES.has(item.code),
          );"""
          if old_warnings not in page:
              raise SystemExit('startWarnings anchor not found')
          page = page.replace(old_warnings, new_warnings, 1)

          old_heading = "Ready to start with safety warnings"
          if old_heading not in page:
              raise SystemExit('old readiness heading not found')
          page = page.replace(old_heading, 'Ready to start with warnings', 1)
          page_path.write_text(page)

          test_path = Path('src/__tests__/work-orders/start-readiness-capability-contract.test.ts')
          test = test_path.read_text()
          old_expect = "    expect(technicianPage).toContain('Ready to start with safety warnings');"
          new_expect = """    expect(technicianPage).toContain('Ready to start with warnings');
            expect(technicianPage).toContain(\"'TECH_ELIG_TRADE_MISMATCH'\");
            expect(technicianPage).toContain(\"'TECH_ELIG_NO_SKILL_RECORD'\");
            expect(technicianPage).toContain(\"'TECH_ELIG_NO_CERTIFICATION'\");
            expect(technicianPage).toContain('!TECHNICIAN_HIDDEN_PROFILE_WARNING_CODES.has(item.code)');
            expect(technicianPage).not.toContain('Ready to start with safety warnings');"""
          if old_expect not in test:
              raise SystemExit('readiness contract heading anchor not found')
          test = test.replace(old_expect, new_expect, 1)
          test_path.write_text(test)
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F "TECH_ELIG_TRADE_MISMATCH" src/components/modules/TechnicianWorkOrderPage.tsx
          grep -F "Ready to start with warnings" src/components/modules/TechnicianWorkOrderPage.tsx
          ! grep -F "Ready to start with safety warnings" src/components/modules/TechnicianWorkOrderPage.tsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-technician-warning-visibility.yml
          git add src/components/modules/TechnicianWorkOrderPage.tsx src/__tests__/work-orders/start-readiness-capability-contract.test.ts
          git commit -m "RWOP: show technicians only actionable start warnings"
          git push origin HEAD:fix/technician-readiness-warning-visibility
