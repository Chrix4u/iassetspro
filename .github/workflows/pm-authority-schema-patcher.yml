name: PM Authority Compatibility Patcher

on:
  push:
    branches:
      - fix/pm-recurrence-authority-current-main-20261026

permissions:
  contents: write

jobs:
  patch-authority-consumers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pm-recurrence-authority-current-main-20261026
          fetch-depth: 0
      - name: Apply recurrence-authority compatibility patch
        run: python .github/scripts/apply_pm_authority_compatibility.py
      - name: Commit patched production files and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/pm-schedules/route.ts
          git add src/app/api/pm-schedules/check-due/route.ts
          git add 'src/app/api/pm-schedules/[id]/route.ts'
          git add src/services/pm/pmScheduledTaskGeneration.service.ts
          git add src/services/pm/advancePmScheduledTaskRecurrence.service.ts
          git add src/services/pm/__tests__/advancePmScheduledTaskRecurrence.service.test.ts
          git add src/__tests__/pm/pm-task-level-generation-api-contract.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Compatibility patch already present."
            exit 0
          fi
          git commit -m "fix(pm): enforce persisted recurrence authority"
          git push origin HEAD:fix/pm-recurrence-authority-current-main-20261026
