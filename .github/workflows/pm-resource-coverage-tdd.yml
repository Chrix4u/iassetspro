name: PM Resource Coverage TDD

on:
  push:
    branches:
      - feature/pm-resource-request-coverage-20261022

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  targeted-pm-tests:
    name: Targeted PM resource coverage tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run targeted PM readiness tests
        run: bunx vitest run src/__tests__/pm/pm-planning-readiness.test.ts src/__tests__/pm/pm-planning-readiness-contract.test.ts
