name: Apply PM template Show Inactive fix

on:
  push:
    branches:
      - fix/pm-template-show-inactive-contract-20261007

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact PM template filter replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/modules/MaintenancePages.tsx')
          text = path.read_text()
          replacements = [
              ('const [filterActive, setFilterActive] = useState(true);', 'const [showInactive, setShowInactive] = useState(false);'),
              ("params.set('active', String(filterActive));", "if (!showInactive) params.set('active', 'true');"),
              ('}, [filterType, filterActive]);', '}, [filterType, showInactive]);'),
              ('checked={filterActive}', 'checked={showInactive}'),
              ('onCheckedChange={setFilterActive}', 'onCheckedChange={setShowInactive}'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          workflow = Path('.github/workflows/pm-template-show-inactive-transform.yml')
          workflow.unlink()

      - name: Commit branch-only transform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modules/MaintenancePages.tsx .github/workflows/pm-template-show-inactive-transform.yml
          git diff --cached --check
          git commit -m "fix(pm): make Show Inactive include inactive templates"
          git push origin HEAD:${GITHUB_REF_NAME}
