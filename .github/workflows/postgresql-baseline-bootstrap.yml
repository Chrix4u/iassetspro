name: PostgreSQL Baseline Bootstrap

on:
  push:
    branches:
      - feat/postgresql-clean-cutover
    paths:
      - scripts/.postgresql-baseline-bootstrap

permissions:
  contents: write

concurrency:
  group: postgresql-baseline-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://bootstrap:bootstrap@127.0.0.1:5432/bootstrap

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/postgresql-clean-cutover
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve PostgreSQL dependencies and regenerate lockfile
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Generate clean PostgreSQL baseline migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20260926000000_postgresql_baseline
          bunx prisma migrate diff             --from-empty             --to-schema prisma/schema.prisma             --script             --output prisma/migrations/20260926000000_postgresql_baseline/migration.sql

          test -s prisma/migrations/20260926000000_postgresql_baseline/migration.sql
          grep -q 'CREATE TABLE' prisma/migrations/20260926000000_postgresql_baseline/migration.sql
          if grep -Eqi 'ENGINE=|FOREIGN_KEY_CHECKS|AUTO_INCREMENT|UNSIGNED|ON DUPLICATE KEY' prisma/migrations/20260926000000_postgresql_baseline/migration.sql; then
            echo "STOP: generated baseline contains MySQL-specific SQL" >&2
            exit 1
          fi

      - name: Remove obsolete npm lock
        run: rm -f package-lock.json

      - name: Commit generated PostgreSQL baseline and Bun lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iAssetsPro CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A bun.lock package-lock.json prisma/migrations
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "PostgreSQL: generate baseline migration and lockfile"
          git push origin HEAD:feat/postgresql-clean-cutover
