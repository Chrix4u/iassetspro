name: PM Task Library Recovery Gate

on:
  push:
    branches: [feature/pm-task-library-foundation-20261022]

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://iassetspro_ci:iassetspro_ci@127.0.0.1:5432/iassetspro_ci?schema=public

jobs:
  recover-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reconstruct verified PM Task Library slice
        run: |
          python3 scripts/recover_pm_task_library_core.py
          python3 scripts/recover_pm_task_library_ui.py
          rm scripts/recover_pm_task_library_core.py
          rm scripts/recover_pm_task_library_ui.py
          rm .github/workflows/recover-pm-task-library.yml

      - name: Validate Prisma schema and client
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Run PM Task focused tests
        run: |
          bunx vitest run \
            src/lib/__tests__/pm-task.test.ts \
            src/__tests__/pm/pm-task-library-schema-contract.test.ts \
            src/__tests__/pm/pm-task-library-api-contract.test.ts \
            src/__tests__/pm/pm-task-library-ui-contract.test.ts

      - name: Lint changed TypeScript sources
        run: |
          bunx eslint \
            src/lib/pm-task.ts \
            src/services/pm/pmTask.service.ts \
            src/services/pm/pmTaskImport.service.ts \
            src/app/api/pm-tasks/route.ts \
            'src/app/api/pm-tasks/[id]/route.ts' \
            src/app/api/pm-tasks/bulk/route.ts \
            src/app/api/pm-tasks/import-template/route.ts \
            src/app/api/pm-tasks/import-preview/route.ts \
            src/app/api/pm-tasks/import-confirm/route.ts \
            src/components/modules/pm/PmTaskLibraryPage.tsx \
            src/components/modules/pm/PmTaskFormDialog.tsx \
            src/components/modules/pm/PmTaskBulkDialog.tsx \
            src/components/modules/pm/PmTaskImportDialog.tsx \
            src/components/EAMApp.tsx \
            src/components/shared/Sidebar.tsx \
            src/components/shared/MobileBottomNav.tsx \
            src/components/CommandPalette.tsx \
            src/lib/page-access.ts \
            src/types/index.ts

      - name: Enforce canonical RWOP lifecycle imports
        run: bunx tsx scripts/check-rwop-legacy-lifecycle-imports.ts

      - name: Run Repairs TypeScript release gate
        run: bunx tsc -p tsconfig.repairs.json --noEmit

      - name: Run PM regression suite
        run: bunx vitest run src/__tests__/pm

      - name: Run full unit suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Verify diff scope and whitespace
        run: |
          git diff --check
          git fetch origin main
          echo 'Changed files:'
          git diff --name-only origin/main...HEAD -- . ':!scripts/recover_pm_task_library_core.py' ':!scripts/recover_pm_task_library_ui.py' ':!.github/workflows/recover-pm-task-library.yml' || true
          if git diff --name-only origin/main -- \
              src/app/api/pm-schedules \
              src/app/api/pm-templates \
              src/app/api/pm-triggers \
              src/services/pm/automationRunner.service.ts \
              src/services/pm/meterTriggerEngine.ts \
              src/services/pm/conditionProductionTriggerEngine.ts | grep -q .; then
            echo 'Legacy PM execution files changed unexpectedly' >&2
            exit 1
          fi

      - name: Commit recovered verified product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pm): add task library foundation'
          git push origin HEAD:feature/pm-task-library-foundation-20261022
