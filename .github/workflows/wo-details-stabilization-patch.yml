name: WO details stabilization patch

on:
  push:
    branches: ["fix/wo-details-stabilization"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          ref: fix/wo-details-stabilization

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Recover and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          git show c4d571becad9f1f4323584109ebf5f7163bf73aa:.github/workflows/wo-details-stabilization-patch.yml > /tmp/previous-workflow.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous-workflow.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/wo_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          git fetch origin refs/pull/26/head:pr26-measurements --depth=1
          git show pr26-measurements:'src/app/api/work-orders/[id]/measurements/route.ts' > 'src/app/api/work-orders/[id]/measurements/route.ts'
          mkdir -p src/__tests__/work-orders
          git show pr26-measurements:'src/__tests__/work-orders/database-backed-measurement-options-contract.test.ts' > 'src/__tests__/work-orders/database-backed-measurement-options-contract.test.ts'
          python3 /tmp/wo_patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/work-orders/database-backed-measurement-options-contract.test.ts')
          text = path.read_text()
          replacements = {
              "Select configured parameter...": "Select configured measurement...",
              "Unit from component setup": 'aria-label="Measurement unit"',
              "selectedOption.componentId": "selected?.componentId",
              "selectedOption.parameterKey": "selected?.parameterKey",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected contract assertion not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/workflows/wo-details-stabilization-patch.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Focused verification
        run: |
          bunx eslint \
            'src/components/modules/TechnicianWorkOrderPage.tsx' \
            'src/components/modules/TechnicianWorkOrderV11Panels.tsx' \
            'src/components/shared/Sidebar.tsx' \
            'src/app/api/work-orders/[id]/measurements/route.ts' \
            'src/app/api/work-orders/[id]/team-member-requests/[reqId]/route.ts'
          bunx tsc -p tsconfig.repairs.json --noEmit
          bunx vitest run src/__tests__/work-orders/database-backed-measurement-options-contract.test.ts

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'RWOP: stabilize technician work order details'
          git push origin HEAD:fix/wo-details-stabilization
