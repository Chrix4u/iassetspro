          '''                  <p className="text-xs text-muted-foreground mt-1">{(request.items || []).map((item: any) => item.tool?.name || item.toolName).filter(Boolean).join(', ') || request.tool?.name || request.toolName || 'Tools'} · {pretty(request.urgency)}</p>\n                  {request.status === 'pending' && <div className="mt-2 flex gap-2">{(request.items || []).length <= 1 && <Button size="sm" variant="ghost" className="h-7 px-2 text-xs" onClick={() => { const item = (request.items || [])[0] || {}; setEditingToolRequestId(request.id); setToolRequest({ toolId: item.toolId || item.tool?.id || request.toolId || '', toolName: item.tool?.name || item.toolName || request.toolName || '', toolCode: item.tool?.toolCode || item.toolCode || '', quantity: String(item.quantityRequested ?? request.quantityRequested ?? 1), urgency: request.urgency || 'normal', reason: request.reason || '' }); }}>Edit</Button>}<Button size="sm" variant="ghost" className="h-7 px-2 text-xs text-red-600" onClick={() => cancelToolRequest(request.id)} disabled={busy !== null}>Cancel</Button></div>}\n                </div>''')

          labor_anchor = '''            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center"><div className="rounded-lg bg-muted/40 p-2"><p className="text-lg font-semibold">{laborSummary.totalEntries || 0}</p><p className="text-[11px] text-muted-foreground">Entries</p></div><div className="rounded-lg bg-muted/40 p-2"><p className="text-lg font-semibold">{Number(laborSummary.totalHours || 0).toFixed(2)}</p><p className="text-[11px] text-muted-foreground">Total h</p></div><div className="rounded-lg bg-muted/40 p-2"><p className="text-lg font-semibold">{Number(laborSummary.personalHours || 0).toFixed(2)}</p><p className="text-[11px] text-muted-foreground">Personal h</p></div><div className="rounded-lg bg-muted/40 p-2"><p className="text-lg font-semibold">{Number(laborSummary.teamHours || 0).toFixed(2)}</p><p className="text-[11px] text-muted-foreground">Team h</p></div></div>'''
          labor_new = labor_anchor + '''\n            {capabilities?.canLogTeamTime && capabilities?.isTeamLeader && (\n              <div className="grid grid-cols-1 gap-2 rounded-lg border p-3 sm:grid-cols-2">\n                <div><Label>Team member *</Label><select className="h-10 w-full rounded-md border bg-background px-3 text-sm" value={teamTime.userId} onChange={(e) => setTeamTime((v) => ({ ...v, userId: e.target.value }))}><option value="">Select team member...</option>{teamTimeCandidates.map((candidate) => <option key={candidate.id} value={candidate.id}>{candidate.name}</option>)}</select></div>\n                <div><Label>Activity</Label><select className="h-10 w-full rounded-md border bg-background px-3 text-sm" value={teamTime.activityType} onChange={(e) => setTeamTime((v) => ({ ...v, activityType: e.target.value }))}><option value="maintenance">Maintenance</option><option value="inspection">Inspection</option><option value="testing">Testing</option><option value="travel">Travel</option><option value="waiting">Waiting</option></select></div>\n                <div><Label>Start</Label><Input type="datetime-local" value={teamTime.startTime} onChange={(e) => setTeamTime((v) => ({ ...v, startTime: e.target.value }))} /></div>\n                <div><Label>End</Label><Input type="datetime-local" value={teamTime.endTime} onChange={(e) => setTeamTime((v) => ({ ...v, endTime: e.target.value }))} /></div>\n                <div><Label>Break minutes</Label><Input type="number" min="0" max="480" value={teamTime.breakMinutes} onChange={(e) => setTeamTime((v) => ({ ...v, breakMinutes: e.target.value }))} /></div>\n                <div><Label>Notes</Label><Input value={teamTime.notes} onChange={(e) => setTeamTime((v) => ({ ...v, notes: e.target.value }))} placeholder="Work performed" /></div>\n                <Button className="sm:col-span-2 sm:w-fit" variant="outline" onClick={logTeamMemberTime} disabled={busy !== null || !teamTime.userId}><Clock3 className="h-4 w-4 mr-1" />Record Team Member Time</Button>\n              </div>\n            )}'''
          replace_once(v11, labor_anchor, labor_new)
          PY

      - name: Remove one-shot workflow before commit
        run: rm -f .github/workflows/wo-details-stabilization-patch.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Focused verification
        run: |
          bunx eslint \
            'src/components/modules/TechnicianWorkOrderPage.tsx' \
            'src/components/modules/TechnicianWorkOrderV11Panels.tsx' \
            'src/components/shared/Sidebar.tsx' \
            'src/app/api/work-orders/[id]/measurements/route.ts' \
            'src/app/api/work-orders/[id]/team-member-requests/[reqId]/route.ts'
          bunx tsc -p tsconfig.repairs.json --noEmit
          bunx vitest run src/__tests__/work-orders/database-backed-measurement-options-contract.test.ts

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'RWOP: stabilize technician work order details'
          git push origin HEAD:fix/wo-details-stabilization
