# ==============================================================================
# UAT Environment — PostgreSQL + Redis infrastructure
# ==============================================================================
# DATABASE_URL=postgresql://repairs_uat:repairs_uat_pass@localhost:5432/repairs_uat
# REDIS_URL=redis://localhost:6379
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: repairs-uat-postgres
    environment:
      POSTGRES_DB: repairs_uat
      POSTGRES_USER: repairs_uat
      POSTGRES_PASSWORD: repairs_uat_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repairs_uat -d repairs_uat']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repairs-uat-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
