# ============================================================================
# iAssetsPro EAM Platform — Docker Compose (Production)
# Services: app (Next.js), Redis, PostgreSQL
# ============================================================================

services:
  app:
    image: ${APP_IMAGE:-iassetspro-eam:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iassetspro-app
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - app-data:/app/data
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - eam-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  postgres:
    image: postgres:17-alpine
    container_name: iassetspro-db
    ports:
      - "${DB_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-iassetspro}
      POSTGRES_USER: ${DB_USER:-eam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eampassword}
    volumes:
      - db-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eam} -d ${DB_NAME:-iassetspro}"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - eam-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    container_name: iassetspro-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - eam-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

volumes:
  db-data:
    name: iassetspro-postgres-data
    driver: local
  redis-data:
    name: iassetspro-redis-data
    driver: local
  app-data:
    name: iassetspro-app-data
    driver: local
  uploads:
    name: iassetspro-uploads
    driver: local

networks:
  eam-network:
    name: iassetspro-network
    driver: bridge
    internal: false
