apiVersion: apps/v1
kind: Deployment
metadata:
  name: iassetspro-app
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: iassetspro-app
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: iassetspro-eam
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: iassetspro-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iassetspro-app
        app.kubernetes.io/component: application
      annotations:
        # Force rollout on configmap/secret changes
        configmap.reloader.stakater.com/reload: "iassetspro-config"
        secret.reloader.stakater.com/reload: "iassetspro-secrets"
    spec:
      terminationGracePeriodSeconds: 60

      # ── Init Container: wait for dependencies ────────────────
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is reachable."
          resources:
            limits:
              memory: 64Mi
              cpu: 50m

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is reachable."
          resources:
            limits:
              memory: 64Mi
              cpu: 50m

      containers:
        - name: app
          image: iassetspro/app:latest  # Replace with your image registry path
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # ── Environment from ConfigMap ───────────────────────
          envFrom:
            - configMapRef:
                name: iassetspro-config
            - secretRef:
                name: iassetspro-secrets
          # ── Startup Probe (gives app time to build/compile) ──
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6      # up to 60s startup window
            successThreshold: 1
          # ── Liveness Probe ───────────────────────────────────
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness Probe ──────────────────────────────────
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              memory: 1Gi
              cpu: "1"
            limits:
              memory: 2Gi
              cpu: "2"
          # ── Volume Mounts ────────────────────────────────────
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      # ── Volumes ──────────────────────────────────────────────
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: app-uploads
---
# ── PVC for file uploads ───────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-uploads
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: iassetspro-app
    app.kubernetes.io/component: application
spec:
  accessModes:
    - ReadWriteMany  # Multiple replicas may need simultaneous write access
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard  # Use a ReadWriteMany-capable StorageClass (e.g., NFS, EFS)
